name: Idea
description: Something ClaudioXP could do better.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you have?
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What is your idea?
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Other ways you thought of, examples, links.
